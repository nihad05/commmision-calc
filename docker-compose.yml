services:
  app:
    container_name: commission-app
    build:
      context: .docker/php
      target: dev
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 1; done; exec php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - ${APP_PORT:-8080}:8000
    volumes:
      - ./:/var/www
    environment:
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    container_name: commission-mysql
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-commission}
      MYSQL_USER: ${DB_USERNAME:-commission}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - ${DB_FORWARD_PORT:-3307}:3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./.docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
